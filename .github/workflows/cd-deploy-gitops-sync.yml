name: CD — GitOps Deploy (Infra Repo)

# This workflow should be placed in the infra repository
# It triggers when PRs are merged to main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync all resources'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}

jobs:
  sync-to-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Flux CLI
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
          flux --version

      - name: Check Flux status
        run: |
          flux check

      - name: Reconcile Flux sources
        run: |
          flux reconcile source git infra --with-source || echo "Flux source not found, skipping"

      - name: Reconcile Kustomizations
        run: |
          # Reconcile all kustomizations or specific ones
          flux reconcile kustomization my-service --with-source || echo "Kustomization not found"

          # List all kustomizations and reconcile
          flux get kustomizations --all-namespaces

      - name: Force sync (if requested)
        if: github.event.inputs.force_sync == 'true'
        run: |
          kubectl get kustomizations -A -o name | xargs -I {} kubectl annotate {} reconcile.fluxcd.io/requestedAt="$(date +%s)" --overwrite

      - name: Verify deployments
        run: |
          echo "Checking deployment status..."
          kubectl get deployments -A
          kubectl get pods -A

      - name: Summary
        run: |
          echo "### ✅ GitOps Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** \`${{ env.AKS_CLUSTER_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Deployments" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -A >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
