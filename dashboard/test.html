<!DOCTYPE html>
<html>
<head>
    <title>Test Page</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: sans-serif;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #1f2937;
            margin: 0 0 20px 0;
        }
        p {
            color: #6b7280;
            margin: 10px 0;
        }
        .success {
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Server is Working!</h1>
        <p class="success">If you can see this, the server is running correctly.</p>
        <p>Now navigate to <strong>index.html</strong> to see your app.</p>
    </div>
</body>
</html>
